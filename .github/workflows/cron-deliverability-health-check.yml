name: Cron - deliverability health check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/deliverability-health-check
        run: |
          curl -f -sS -X POST "${{ secrets.APP_URL }}/api/cron/deliverability-health-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
