name: Cron - integrations digest

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/integrations-digest
        run: |
          curl -f -sS -X POST "${{ secrets.APP_URL }}/api/cron/integrations-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
