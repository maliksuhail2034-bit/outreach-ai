name: Cron - sync replies

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/sync-replies
        run: |
          curl -f -sS -X POST "${{ secrets.APP_URL }}/api/cron/sync-replies" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
